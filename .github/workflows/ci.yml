name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build, verify and Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (formatter, unit, integration, ArchUnit, Flyway, package)
        # Testcontainers uses the Docker engine preinstalled on the runner; no real simulator.
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t garage-api:${{ github.sha }} .

      - name: Validate docker compose
        run: docker compose config --quiet
